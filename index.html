<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>عيادة المحصول — بنك الحالات (يعمل بدون إنترنت)</title>
<style>
  :root{
    --soil:#1f2b18; --card:#f2ecd9; --card-edge:#d8cca4; --ink:#25301c;
    --amber:#c07a2b; --sage:#5f7a4f; --sage-l:#dfe6d2; --brick:#a8402a; --brick-l:#f0d9d2;
  }
  @font-face{ font-family:'sysar'; src:local('Tahoma'); }
  *{box-sizing:border-box;}
  body{
    margin:0; background:radial-gradient(circle at 20% 0%, #33452a 0%, var(--soil) 55%);
    color:var(--card); font-family:'Tahoma','Segoe UI',sans-serif; min-height:100vh; padding:16px 12px 40px;
  }
  .wrap{max-width:480px;margin:0 auto;}
  header{text-align:center;margin-bottom:14px;}
  header .eyebrow{font-size:10.5px;letter-spacing:2px;color:#a9c08f;text-transform:uppercase;}
  header h1{font-size:26px;margin:4px 0 2px;font-weight:900;}
  header p{margin:0;font-size:12px;color:#b7c4a5;}

  .stats{display:flex;gap:8px;margin:14px 0;}
  .stat{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:8px 6px;text-align:center;}
  .stat b{display:block;font-size:17px;color:#e8d9a8;}
  .stat span{font-size:10px;color:#a9b696;}
  .weak{font-size:11px;color:#d9c497;text-align:center;margin-bottom:8px;min-height:14px;}

  .catbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px;}
  .catbtn{
    font-size:10.5px;padding:5px 9px;border-radius:20px;border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.06);color:#dfe6d2;cursor:pointer;
  }
  .catbtn.active{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:700;}

  .card{position:relative;background:var(--card);color:var(--ink);border-radius:6px;border:1px solid var(--card-edge);
    box-shadow:0 18px 34px -14px rgba(0,0,0,0.55);padding:16px 16px 18px;margin-top:6px;}
  .card::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:34px;height:18px;
    background:var(--card);border:1px solid var(--card-edge);border-radius:4px;}

  .illus{width:100%;display:flex;justify-content:center;background:#e9e2c9;border-radius:6px;padding:10px 0;margin-bottom:12px;}
  .illus svg{width:130px;height:130px;}

  .card-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px dashed var(--card-edge);padding-bottom:8px;margin-bottom:10px;}
  .crop-name{font-size:18px;font-weight:900;}
  .meta{text-align:left;font-size:10px;color:#8a7d55;}
  .meta .lvl{display:inline-block;margin-top:4px;padding:2px 7px;border-radius:20px;background:var(--sage-l);color:var(--sage);font-weight:700;font-size:10px;}

  .symptoms{font-size:14px;line-height:1.9;color:#3a3020;}
  .options{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
  .opt{text-align:right;padding:11px 13px;border-radius:8px;border:1.5px solid var(--card-edge);background:#fbf7ea;font-size:13.5px;color:var(--ink);cursor:pointer;}
  .opt:active{filter:brightness(0.97);}
  .opt.correct{background:var(--sage-l);border-color:var(--sage);font-weight:700;}
  .opt.wrong{background:var(--brick-l);border-color:var(--brick);}
  .opt:disabled{cursor:default;}

  .feedback{margin-top:12px;padding:11px 13px;border-radius:8px;font-size:13px;line-height:1.8;display:none;}
  .feedback.show{display:block;}
  .feedback.ok{background:var(--sage-l);color:#2f4324;border:1px solid var(--sage);}
  .feedback.no{background:var(--brick-l);color:#5a2015;border:1px solid var(--brick);}
  .feedback b{display:block;margin-bottom:4px;font-size:14px;}
  .treat-box{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(0,0,0,0.15);font-size:12.5px;}
  .treat-label{display:inline;font-size:12.5px;margin-left:4px;}

  .guide-btn{
    display:block;width:100%;margin:2px 0 10px;padding:9px;border-radius:8px;
    border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.06);
    color:#f2ecd9;font-size:12.5px;font-weight:700;cursor:pointer;text-align:center;
  }
  .modal{position:fixed;inset:0;background:rgba(10,14,7,0.92);z-index:50;display:none;padding:16px 12px;overflow-y:auto;}
  .modal.show{display:block;}
  .modal-inner{max-width:480px;margin:0 auto;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .modal-head h2{font-size:17px;margin:0;color:#f2ecd9;}
  .modal-close{background:var(--amber);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;}
  .guide-group{margin-bottom:14px;}
  .guide-group h3{font-size:13px;color:#d9c497;margin:0 0 6px;border-bottom:1px solid rgba(255,255,255,0.15);padding-bottom:4px;}
  .guide-item{background:var(--card);color:var(--ink);border-radius:7px;padding:9px 11px;margin-bottom:6px;font-size:12.5px;line-height:1.7;}
  .guide-item b{display:block;font-size:13px;margin-bottom:2px;}
  .guide-item .gi-treat{color:#5f7a4f;font-weight:700;}

  .next-btn{width:100%;margin-top:12px;padding:13px;border:none;border-radius:9px;background:var(--amber);color:#fff;font-weight:900;font-size:15px;cursor:pointer;}
  footer{text-align:center;margin-top:18px;font-size:10px;color:#7a8a68;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">OFFLINE CASE BANK</div>
    <h1>عيادة المحصول</h1>
    <p id="bank-count">بنك حالات تشخيصية — يعمل بالكامل بدون إنترنت</p>
  </header>

  <div class="stats">
    <div class="stat"><b id="st-total">0</b><span>حالة</span></div>
    <div class="stat"><b id="st-acc">—</b><span>الدقة</span></div>
    <div class="stat"><b id="st-seen">0</b><span>من البنك</span></div>
  </div>
  <div class="weak" id="weak-line"></div>
  <button class="guide-btn" id="guide-btn">💊 دليل المكافحة — المواد الفعالة لكل مرض وآفة</button>
  <div class="catbar" id="catbar"></div>

  <div class="card">
    <div class="illus" id="illus-box"></div>
    <div class="card-top">
      <div class="crop-name" id="crop-name">—</div>
      <div class="meta"><div id="cat-label">فئة</div><div class="lvl" id="lvl-badge">—</div></div>
    </div>
    <div class="symptoms" id="symptoms-box"></div>
    <div class="options" id="options-box"></div>
    <div class="feedback" id="feedback-box"></div>
  </div>
  <button class="next-btn" id="next-btn">الحالة التالية ⟵</button>
  <footer id="footer-note">الصور توضيحية (SVG) وليست صورًا فوتوغرافية — لتفادي أي مشاكل حقوق نشر وضمان عمل الملف بالكامل دون إنترنت.</footer>
</div>

<div class="modal" id="guide-modal">
  <div class="modal-inner">
    <div class="modal-head">
      <h2>دليل المكافحة</h2>
      <button class="modal-close" id="guide-close">إغلاق ✕</button>
    </div>
    <div id="guide-content"></div>
  </div>
</div>

<script>
/* ===================== بيانات المحاصيل ===================== */
const CROPS = {
 grape:'العنب', citrus:'الحمضيات', tomato:'الطماطم', wheat:'القمح', olive:'الزيتون',
 apple:'التفاح', cucumber:'الخيار', eggplant:'الباذنجان', pepper:'الفلفل', potato:'البطاطا',
 fig:'التين', pomegranate:'الرمان', almond:'اللوز', apricot:'المشمش', peach:'الخوخ',
 corn:'الذرة', beans:'الفول', strawberry:'الفراولة'
};
const ALL_CROPS = Object.keys(CROPS);

const CATS = {
 nutrient:'نقص عناصر غذائية', fungal:'أمراض فطرية', pest:'آفات حشرية',
 physio:'حالات فسيولوجية', pruning:'تقليم وإدارة النبات',
 irrigation:'ري وتسميد', organic:'مخلفات عضوية وتكامل زراعي'
};

/* ===================== أدوات مساعدة ===================== */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seededShuffle(arr, seed){
  const rnd = mulberry32(seed); const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pick(arr, n, seed){ return seededShuffle(arr, seed).slice(0,n); }

/* ===================== 1) نقص العناصر (عام على كل المحاصيل) ===================== */
const NUTRIENTS = [
 {name:'نقص الحديد (Fe)', symptom:'اصفرار واضح بين العروق في الأوراق الحديثة (الطرفية) بينما تبقى العروق نفسها خضراء داكنة. يظهر بشكل خاص في الترب الجيرية القلوية.', explain:'هذا النمط (اصفرار بين العروق + على الأوراق الجديدة أولًا) توقيع كلاسيكي لنقص الحديد، لأن الحديد غير قابل لإعادة الانتقال داخل النبات فتظهر الأعراض على النموات الحديثة أولًا.'},
 {name:'نقص النيتروجين (N)', symptom:'اصفرار عام منتظم (غير محصور بين العروق) يبدأ من الأوراق المسنة السفلية ويتقدم تدريجيًا للأعلى، مع ضعف عام في قوة النمو الخضري وصغر حجم الأوراق الجديدة.', explain:'النيتروجين عنصر متحرك داخل النبات، فعند نقصه ينتقل من الأوراق المسنة إلى الحديثة، ما يفسر ظهور الاصفرار العام من الأسفل أولًا.'},
 {name:'نقص البوتاسيوم (K)', symptom:'احتراق واسمرار في حواف الأوراق المسنة يبدأ من الحافة الخارجية ويتقدم للداخل (Scorch)، مع ضعف واضح في مقاومة النبات للجفاف والأمراض وترهل الثمار.', explain:'البوتاسيوم ينظم توازن الماء وإغلاق الثغور، ونقصه يظهر كحرق حافي على الأوراق الأقدم لأنه عنصر متحرك يُسحب منها أولًا.'},
 {name:'نقص المغنيسيوم (Mg)', symptom:'اصفرار بين العروق يبدأ من الأوراق المسنة القاعدية (عكس الحديد تمامًا) وقد يصاحبه احمرار أو بنفسجية عند بعض الأصناف، ويتقدم من أسفل النبات نحو الأعلى.', explain:'المغنيسيوم هو مركز جزيء الكلوروفيل وهو عنصر متحرك، فعند نقصه يُسحب من الأوراق المسنة لصالح الحديثة، فتظهر الأعراض أولًا في الأسفل بعكس الحديد.'},
 {name:'نقص الزنك (Zn)', symptom:'تصغّر ملحوظ في حجم الأوراق الطرفية مع تقارب السلاميات (تعقّد النموات في شكل وردي Rosetting)، مصحوبًا باصفرار بين العروق في الأوراق الحديثة.', explain:'الزنك ضروري لتصنيع هرمونات النمو (الأوكسينات)، ونقصه يوقف استطالة السلاميات فتظهر النموات متقاربة وصغيرة الأوراق (تعقّد).'},
 {name:'نقص الكالسيوم (Ca)', symptom:'تيبّس وتقزّم في قمم النموات الحديثة مع ضعف واضح في الجذور، وقد يظهر تعفن أو تشقق في طرف الثمار الزهري في الأنواع المثمرة.', explain:'الكالسيوم غير متحرك في النبات ولازم لبناء جدران الخلايا، فنقصه يضرب أولًا الأنسجة الحديثة سريعة الانقسام (القمم النامية وأطراف الثمار).'},
 {name:'نقص البورون (B)', symptom:'تشقق في السيقان والأعناق مع سقوط ملحوظ للأزهار وضعف في نسبة العقد (تلقيح ضعيف)، وتشوه أو تصلب في الثمار الناتجة.', explain:'البورون ضروري لنمو أنبوب اللقاح وانقسام الخلايا في الأنسجة الحديثة، فنقصه يضعف التلقيح والعقد ويسبب تشققًا في الأنسجة سريعة النمو.'}
];

/* ===================== 2) أمراض فطرية ===================== */
const FUNGAL = [
 {name:'البياض الدقيقي', crops:['grape','apple','cucumber','strawberry'], symptom:'طبقة دقيقية بيضاء إلى رمادية تغطي السطحين العلوي والسفلي للأوراق والبراعم، مع تجعد وتقزّم النموات الفتية وتساقطها أحيانًا. ينشط في جو دافئ جاف نهارًا مع رطوبة عالية ليلاً.', explain:'المظهر "الدقيقي" الأبيض الجاف المنتشر على السطحين مع نشاط الجو الدافئ الجاف نهارًا هو العلامة المميزة للبياض الدقيقي، بخلاف البياض الزغبي المرتبط بالرطوبة الممطرة.', treatment:'الكبريت الزراعي رشًا وقائيًا دوريًا، أو مبيد فطري جهازي من مجموعة التريازول عند الإصابة الفعلية، مع تحسين التهوية بين النباتات.'},
 {name:'البياض الزغبي', crops:['grape','cucumber'], symptom:'بقع صفراء زيتية على السطح العلوي للورقة، ويقابلها بالضبط نمو زغبي رمادي إلى بنفسجي على السطح السفلي فقط. ينشط بشدة في الطقس الرطب الممطر.', explain:'وجود النمو الزغبي محصورًا في السطح السفلي فقط مقابل بقعة صفراء علوية، مع ارتباطه بالرطوبة والمطر، يميزه بوضوح عن البياض الدقيقي.', treatment:'مركبات نحاسية (أوكسي كلورو النحاس) وقائيًا، أو مبيد جهازي من مجموعة الميتالاكسيل عند الإصابة، مع تجنب الري العلوي مساءً.'},
 {name:'العفن الرمادي (بوتريتس)', crops:['grape','strawberry','tomato'], symptom:'تعفن طري بني رمادي مع نمو عفن قطني كثيف رمادي اللون يغطي الثمار الناضجة أو الأزهار، يظهر بقوة بعد فترات مطر أو رطوبة عالية مستمرة.', explain:'التعفن الطري المصحوب بنمو قطني رمادي كثيف على الأنسجة الرطبة (الثمار والأزهار تحديدًا) توقيع مميز لفطر البوتريتس.', treatment:'مبيد فطري متخصص ضد البوتريتس (مجموعة الأنيلينوبيريميدين)، مع تقليل كثافة الأوراق حول العناقيد والثمار لتحسين التهوية.'},
 {name:'صدأ الأوراق', crops:['wheat','beans'], symptom:'بثرات صغيرة بارزة برتقالية إلى بنية تتوزع على السطح السفلي غالبًا، وتترك مسحوقًا ملونًا عند فرك الورقة باليد.', explain:'شكل البثرات البارزة مع "المسحوق" الملون الذي يعلق باليد عند اللمس هو العلامة التشخيصية القياسية لأمراض الصدأ.', treatment:'مبيد فطري جهازي من مجموعة التريازول عند ظهور أولى البثرات، مع زراعة أصناف مقاومة عند توفرها كإجراء وقائي أساسي.'},
 {name:'التفحم', crops:['wheat','corn'], symptom:'تحوّل حبيبات السنبلة أو كوز الذرة إلى كتلة سوداء مسحوقية بالكامل بدلًا من الحبوب الطبيعية، مع بقاء الغلاف الخارجي سليمًا في البداية.', explain:'استبدال الحبة بالكامل بكتلة سوداء مسحوقية (بدل بقعة على الورقة) هو ما يميز أمراض التفحم عن باقي الأمراض الفطرية.', treatment:'لا علاج بعد ظهور الأعراض على السنابل؛ الوقاية الوحيدة الفعالة معاملة البذور قبل الزراعة بمطهر فطري جهازي مخصص للبذار.'},
 {name:'اللفحة المتأخرة', crops:['potato','tomato'], symptom:'بقع بنية مائية غير منتظمة الحواف تتوسع بسرعة كبيرة خلال أيام، مع نمو أبيض خفيف على حافة البقعة السفلية في الجو الرطب، وتعفن فيما بعد بالدرنات أو الثمار.', explain:'السرعة الفائقة في انتشار البقع مع النمو الأبيض على الحافة السفلية في الرطوبة هما ما يميزان اللفحة المتأخرة عن المبكرة الأبطأ والأكثر انتظامًا.', treatment:'مبيد نحاسي وقائي أو مركب جهازي من مجموعة الماكوزيب فور ظهور الجو الرطب المناسب، مع إزالة النباتات المصابة فورًا لمنع الانتشار.'},
 {name:'اللفحة المبكرة', crops:['potato','tomato','eggplant'], symptom:'بقع بنية دائرية منتظمة تحمل حلقات متحدة المركز (بشكل يشبه الهدف)، تبدأ من الأوراق المسنة السفلية أولًا وتتقدم ببطء نسبي.', explain:'الحلقات المتحدة المركز الواضحة (شكل الهدف) بالإضافة لبدء الإصابة من الأوراق المسنة هما العلامة المميزة للفحة المبكرة.', treatment:'مبيد من مجموعة الماكوزيب أو الكلوروثالونيل رشًا وقائيًا دوريًا خلال موسم الرطوبة.'},
 {name:'عين الطاووس', crops:['olive'], symptom:'بقع دائرية بنية إلى سوداء محاطة بهالة صفراء واضحة على السطح العلوي للورقة، تتسبب في تساقط أوراق شديد خلال الشتاء الرطب.', explain:'الهالة الصفراء المحيطة بالبقعة الداكنة (تشبه شكل ريشة الطاووس) هي العلامة المميزة لهذا المرض الخاص بالزيتون.', treatment:'رشة نحاسية وقائية (مزيج بوردو) في الخريف قبل بدء موسم الأمطار.'},
 {name:'عفن الذبول (فيرتيسيليوم)', crops:['eggplant','pepper','strawberry'], symptom:'ذبول تدريجي أحادي الجانب في النبات مصحوب باصفرار الأوراق السفلية، وعند قطع الساق طوليًا يظهر تلوّن بني داخلي واضح في الأنسجة الوعائية.', explain:'التلوّن البني الداخلي في الأوعية عند القطع، مع الذبول الأحادي الجانب، دليل قاطع على انسداد الأوعية بفطريات الذبول وليس نقص ري عادي.', treatment:'لا يوجد علاج كيميائي فعّال بعد ظهور الإصابة؛ الوقاية عبر الدورة الزراعية وتعقيم التربة بالتشميس الشمسي قبل الزراعة.'},
 {name:'الأنثراكنوز', crops:['beans','pepper','almond'], symptom:'بقع غائرة داكنة اللون على القرون أو الثمار وأحيانًا السيقان، بمركز فاتح اللون تتوسطه نقاط سوداء دقيقة جدًا (أجسام إثمارية للفطر).', explain:'البقع الغائرة (وليست بارزة) مع النقاط السوداء الدقيقة في مركزها الفاتح هي العلامة المميزة لمرض الأنثراكنوز.', treatment:'مبيد من مجموعة الماكوزيب أو مركب نحاسي، مع إزالة وإتلاف القرون والثمار المصابة فورًا.'},

 {name:'التكامل بين الحيوان والمحصول', crops:['wheat','corn'], shape:'soil', symptom:'تحسن تدريجي وملحوظ في خصوبة التربة العامة عبر عدة مواسم متتالية، بعد دمج مخلفات حظائر الأغنام المتخمرة جيدًا ضمن دورة زراعية متكاملة مع المحاصيل الحقلية.', explain:'دمج المخلفات الحيوانية المتخمرة ضمن دورة منتظمة يعيد تدوير العناصر الغذائية عضويًا ويحسّن بنية التربة تراكميًا على مدى مواسم متعددة.'},

 {name:'إعادة تدوير مخلفات المحصول نفسه', crops:['wheat','corn'], shape:'soil', symptom:'تحسن تدريجي وملحوظ في محتوى التربة من المادة العضوية عبر مواسم متتالية، بعد حراثة وإعادة دمج قش المحصول السابق مباشرة في التربة بدل حرقه كالمعتاد.', explain:'حرق القش يفقد التربة كمية كبيرة من المادة العضوية والعناصر التي كان يمكن أن تعود إليها عبر التحلل الطبيعي، فإعادة دمجه يحسّن خصوبة التربة تراكميًا بدل إهدارها.'}
];

/* ===================== توليد بنك الحالات ===================== */
let CASE_BANK = [];
let idc = 0;

function addCase(cat, cropId, name, symptom, options, correctIndex, explain, severity, shapeOverride, treatment){
  idc++;
  CASE_BANK.push({
    id: idc, category: cat, crop: CROPS[cropId], name,
    symptom: (severity==='early' ? 'في مرحلة مبكرة من الإصابة: ' : severity==='advanced' ? 'في حالة متقدمة نسبيًا: ' : '') + symptom,
    options, correctIndex, explain, shape: shapeOverride || defaultShape(cat), treatment: treatment || null
  });
}
function defaultShape(cat){
  if(cat==='physio') return 'fruit';
  if(cat==='pruning') return 'branch';
  if(cat==='organic') return 'soil';
  return 'leaf';
}

// 1) نقص العناصر: لكل عنصر × كل المحاصيل
const NUTRIENT_NAMES = NUTRIENTS.map(n=>n.name);
NUTRIENTS.forEach((fact, fi)=>{
  ALL_CROPS.forEach((cropId, ci)=>{
    const distractors = pick(NUTRIENT_NAMES.filter(n=>n!==fact.name), 3, fi*100+ci);
    const options = seededShuffle([fact.name, ...distractors], fi*77+ci*13);
    addCase('nutrient', cropId, fact.name, fact.symptom, options, options.indexOf(fact.name), fact.explain, null);
  });
});

// دالة عامة لتوليد حالات فئة معينة من بنك حقائق فيه crops لكل حقيقة
function buildFromFacts(catKey, facts, allNames, variants){
  facts.forEach((fact, fi)=>{
    fact.crops.forEach((cropId, ci)=>{
      const distractors = pick(allNames.filter(n=>n!==fact.name), 3, fi*50+ci*7+catKey.length);
      variants.forEach((sev, vi)=>{
        const seed = fi*997 + ci*131 + vi*17 + catKey.length;
        const options = seededShuffle([fact.name, ...distractors], seed);
        addCase(catKey, cropId, fact.name, fact.symptom, options, options.indexOf(fact.name), fact.explain, sev, fact.shape, fact.treatment);
      });
    });
  });
}

buildFromFacts('fungal', FUNGAL, FUNGAL.map(f=>f.name), [null,'early','advanced']);
buildFromFacts('pest', PESTS, PESTS.map(f=>f.name), [null,'early','advanced']);
buildFromFacts('physio', PHYSIO, PHYSIO.map(f=>f.name), [null,'advanced']);
buildFromFacts('pruning', PRUNING, PRUNING.map(f=>f.name), [null,'advanced']);
buildFromFacts('irrigation', IRRIGATION, IRRIGATION.map(f=>f.name), [null,'advanced']);
buildFromFacts('organic', ORGANIC, ORGANIC.map(f=>f.name), [null,'advanced']);

document.getElementById('bank-count').textContent = `${CASE_BANK.length} حالة تشخيصية — يعمل بالكامل بدون إنترنت`;

/* ===================== SVG توضيحي ===================== */
function svgLeaf(tone, spotType, spotCount, seed){
  const rnd = mulberry32(seed);
  const fillMap = {healthy:'#4d7a3a', yellow:'#d9c24a', yellowInter:'#e3d27a', brownEdge:'#4d7a3a', small:'#5a8a45', wilt:'#6f8a55', salt:'#7a9160'};
  const fill = fillMap[tone] || '#4d7a3a';
  let spots = '';
  if(spotType){
    for(let i=0;i<spotCount;i++){
      const x = 25+rnd()*50, y = 20+rnd()*65, r = 3+rnd()*4;
      const c = spotType==='disease' ? '#3d2a1a' : spotType==='hole' ? '#e9e2c9' : '#ffffff';
      spots += `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity="${spotType==='hole'?1:0.85}"/>`;
    }
  }
  let extra = '';
  if(tone==='brownEdge') extra = `<path d="M50,10 C20,20 10,50 10,70 C10,90 30,95 50,98 C70,95 90,90 90,70 C90,50 80,20 50,10 Z" fill="none" stroke="#8a4a28" stroke-width="4"/>`;
  if(tone==='yellowInter') extra = `<path d="M50,15 L50,95 M35,30 L50,50 M65,30 L50,50 M30,55 L50,65 M70,55 L50,65" stroke="#3d5c2a" stroke-width="3" fill="none"/>`;
  return `<svg viewBox="0 0 100 110">
    <path d="M50,10 C20,20 10,50 10,70 C10,90 30,95 50,98 C70,95 90,90 90,70 C90,50 80,20 50,10 Z" fill="${fill}"/>
    <path d="M50,12 L50,96" stroke="#2f4324" stroke-width="2" opacity="0.5"/>
    ${extra}${spots}
  </svg>`;
}
function svgFruit(markType, seed){
  const rnd = mulberry32(seed);
  let mark='';
  if(markType==='darkPatch') mark = `<ellipse cx="50" cy="82" rx="16" ry="10" fill="#3a2418"/>`;
  else if(markType==='crack'){ for(let i=0;i<3;i++){ const a=rnd()*Math.PI*2; mark+=`<path d="M50,50 L${50+Math.cos(a)*30},${50+Math.sin(a)*30}" stroke="#fff" stroke-width="2"/>`; } }
  else if(markType==='whitePatch') mark = `<ellipse cx="35" cy="35" rx="18" ry="14" fill="#e9e2c9" opacity="0.85"/>`;
  else mark = `<circle cx="55" cy="60" r="6" fill="#3a2418"/>`;
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="55" r="42" fill="#b8452f"/><ellipse cx="38" cy="38" rx="10" ry="6" fill="#d4664a" opacity="0.6"/>${mark}</svg>`;
}
function svgBranch(markType){
  let mark='';
  if(markType==='gum') mark = `<ellipse cx="55" cy="55" rx="8" ry="10" fill="#c07a2b" opacity="0.9"/>`;
  else if(markType==='crack') mark = `<path d="M30,20 L45,90" stroke="#3a2418" stroke-width="2"/>`;
  else mark = `<circle cx="55" cy="45" r="7" fill="#e9e2c9"/>`;
  return `<svg viewBox="0 0 100 100"><rect x="20" y="10" width="16" height="90" rx="8" fill="#6b4a2c" transform="rotate(20 50 50)"/>${mark}</svg>`;
}
function svgSoil(){
  return `<svg viewBox="0 0 100 100">
    <rect x="10" y="55" width="80" height="14" fill="#5a3d24"/>
    <rect x="10" y="69" width="80" height="14" fill="#4a3019"/>
    <rect x="10" y="83" width="80" height="10" fill="#3a2513"/>
    <circle cx="30" cy="60" r="2.5" fill="#2e1e10"/><circle cx="55" cy="63" r="2" fill="#2e1e10"/><circle cx="70" cy="59" r="2.5" fill="#2e1e10"/>
    <path d="M50,55 C48,40 52,30 50,18" stroke="#4d7a3a" stroke-width="3" fill="none"/>
    <circle cx="50" cy="15" r="6" fill="#5a9040"/>
  </svg>`;
}

function iconFor(c){
  const seed = c.id;
  if(c.shape==='fruit'){
    const map = {'تعفن طرف الثمرة':'darkPatch','تشقق الثمار':'crack','لفحة الشمس':'whitePatch','بقاء الكتف الأخضر':'whitePatch','ضعف التلقيح وتشوه الثمار':'crack'};
    return svgFruit(map[c.name] || 'darkPatch', seed);
  }
  if(c.shape==='branch'){
    const map = {'تصمغ اللوزيات':'gum','تشقق اللحاء الشتوي':'crack','نزيف العصارة بعد التقليم المتأخر':'gum'};
    return svgBranch(map[c.name] || 'cut');
  }
  if(c.shape==='soil') return svgSoil();
  // leaf
  if(c.category==='nutrient'){
    const toneMap = {'نقص الحديد (Fe)':'yellowInter','نقص النيتروجين (N)':'yellow','نقص البوتاسيوم (K)':'brownEdge','نقص المغنيسيوم (Mg)':'yellowInter','نقص الزنك (Zn)':'small','نقص الكالسيوم (Ca)':'healthy','نقص البورون (B)':'healthy'};
    return svgLeaf(toneMap[c.name]||'yellow', null, 0, seed);
  }
  if(c.category==='fungal') return svgLeaf('healthy','disease', c.symptom.includes('مبكرة')?3:c.symptom.includes('متقدمة')?9:6, seed);
  if(c.category==='pest') return svgLeaf('healthy','hole', c.symptom.includes('مبكرة')?2:c.symptom.includes('متقدمة')?7:4, seed);
  return svgLeaf('wilt', null, 0, seed);
}

/* ===================== حالة التطبيق ===================== */
let progress = { total:0, correct:0, weakness:{}, seenIds:[] };
let activeCat = 'all';
let currentCase = null;

function loadProgress(){
  try{ const raw = localStorage.getItem('crop-clinic-progress'); if(raw) progress = JSON.parse(raw); }catch(e){}
  renderStats();
}
function saveProgress(){ try{ localStorage.setItem('crop-clinic-progress', JSON.stringify(progress)); }catch(e){} }

function renderStats(){
  document.getElementById('st-total').textContent = progress.total;
  document.getElementById('st-acc').textContent = progress.total ? Math.round(100*progress.correct/progress.total)+'%' : '—';
  document.getElementById('st-seen').textContent = progress.seenIds.length + '/' + CASE_BANK.length;
  const weakSorted = Object.entries(progress.weakness).sort((a,b)=>b[1]-a[1]).slice(0,2);
  document.getElementById('weak-line').textContent = weakSorted.length ? 'نقاط ضعف: ' + weakSorted.map(w=>CATS[w[0]]).join(' · ') : '';
}

function buildCatBar(){
  const bar = document.getElementById('catbar');
  const all = [['all','الكل'], ...Object.entries(CATS)];
  bar.innerHTML='';
  all.forEach(([key,label])=>{
    const b = document.createElement('button');
    b.className = 'catbtn' + (key===activeCat?' active':'');
    b.textContent = label;
    b.onclick = ()=>{ activeCat = key; buildCatBar(); nextCase(); };
    bar.appendChild(b);
  });
}

function pickNextCase(){
  let pool = activeCat==='all' ? CASE_BANK : CASE_BANK.filter(c=>c.category===activeCat);
  const unseen = pool.filter(c=>!progress.seenIds.includes(c.id));
  const weakCats = Object.entries(progress.weakness).sort((a,b)=>b[1]-a[1]).map(w=>w[0]);
  if(weakCats.length && Math.random()<0.35){
    const weakPool = pool.filter(c=>c.category===weakCats[0]);
    if(weakPool.length) return weakPool[Math.floor(Math.random()*weakPool.length)];
  }
  if(unseen.length) return unseen[Math.floor(Math.random()*unseen.length)];
  return pool[Math.floor(Math.random()*pool.length)];
}

function nextCase(){
  const c = pickNextCase();
  currentCase = c;
  document.getElementById('illus-box').innerHTML = iconFor(c);
  document.getElementById('crop-name').textContent = c.crop;
  document.getElementById('cat-label').textContent = CATS[c.category];
  document.getElementById('lvl-badge').textContent = c.symptom.startsWith('في مرحلة مبكرة') ? 'مبكر' : c.symptom.startsWith('في حالة متقدمة') ? 'متقدم' : 'قياسي';
  document.getElementById('symptoms-box').textContent = c.symptom;
  const box = document.getElementById('options-box');
  box.innerHTML='';
  c.options.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='opt'; b.textContent=opt; b.onclick=()=>answer(i);
    box.appendChild(b);
  });
  document.getElementById('feedback-box').className='feedback';
  if(!progress.seenIds.includes(c.id)) progress.seenIds.push(c.id);
}

function answer(i){
  const buttons = document.querySelectorAll('.opt');
  buttons.forEach(b=>b.disabled=true);
  const correct = currentCase.correctIndex;
  buttons[correct].classList.add('correct');
  const isRight = i===correct;
  if(!isRight){
    buttons[i].classList.add('wrong');
    progress.weakness[currentCase.category] = (progress.weakness[currentCase.category]||0)+1;
  }
  progress.total++; if(isRight) progress.correct++;
  saveProgress(); renderStats();
  const fb = document.getElementById('feedback-box');
  fb.className = 'feedback show ' + (isRight?'ok':'no');
  let html = `<b>${isRight?'✔ إجابة صحيحة — '+currentCase.name:'✘ غير دقيق — الصحيح: '+currentCase.name}</b>${currentCase.explain}`;
  if(currentCase.treatment){
    html += `<div class="treat-box">💊 <b class="treat-label">العلاج / المادة الفعالة</b>${currentCase.treatment}</div>`;
  }
  fb.innerHTML = html;
}

document.getElementById('next-btn').addEventListener('click', nextCase);

/* ===================== دليل المكافحة ===================== */
function buildGuide(){
  const content = document.getElementById('guide-content');
  let html = '';
  html += '<div class="guide-group"><h3>🍄 أمراض فطرية</h3>';
  FUNGAL.forEach(f=>{
    html += `<div class="guide-item"><b>${f.name}</b>${f.treatment ? '<span class="gi-treat">'+f.treatment+'</span>' : ''}</div>`;
  });
  html += '</div><div class="guide-group"><h3>🐛 آفات حشرية</h3>';
  PESTS.forEach(f=>{
    html += `<div class="guide-item"><b>${f.name}</b>${f.treatment ? '<span class="gi-treat">'+f.treatment+'</span>' : ''}</div>`;
  });
  html += '</div>';
  content.innerHTML = html;
}
document.getElementById('guide-btn').addEventListener('click', ()=>{
  buildGuide();
  document.getElementById('guide-modal').classList.add('show');
});
document.getElementById('guide-close').addEventListener('click', ()=>{
  document.getElementById('guide-modal').classList.remove('show');
});

buildCatBar();
loadProgress();
nextCase();
</script>
