لتربة كمية كبيرة من المادة العضوية والعناصر التي كان يمكن أن تعود إليها عبر التحلل الطبيعي، فإعادة دمجه يحسّن خصوبة التربة تراكميًا بدل إهدارها.","shape":"soil","treatment":null,"photo":null},{"id":531,"category":"organic","crop":"الذرة","cropId":"corn","name":"إعادة تدوير مخلفات المحصول نفسه","symptom":"في حالة متقدمة نسبيًا: تحسن تدريجي وملحوظ في محتوى التربة من المادة العضوية عبر مواسم متتالية، بعد حراثة وإعادة دمج قش المحصول السابق مباشرة في التربة بدل حرقه كالمعتاد.","options":["ضرر مخلفات معصرة الزيتون الطازجة","خطر مخلفات التقليم المصابة","حرق السماد العضوي غير الناضج","إعادة تدوير مخلفات المحصول نفسه"],"correctIndex":3,"explain":"حرق القش يفقد التربة كمية كبيرة من المادة العضوية والعناصر التي كان يمكن أن تعود إليها عبر التحلل الطبيعي، فإعادة دمجه يحسّن خصوبة التربة تراكميًا بدل إهدارها.","shape":"soil","treatment":null,"photo":null}]</script>
<script type="application/json" id="fact-data">[{"name":"نقص الحديد (Fe)","slug":"fe_deficiency","symptom":"اصفرار واضح بين العروق في الأوراق الحديثة (الطرفية) بينما تبقى العروق نفسها خضراء داكنة. يظهر بشكل خاص في الترب الجيرية القلوية.","explain":"هذا النمط (اصفرار بين العروق + على الأوراق الجديدة أولًا) توقيع كلاسيكي لنقص الحديد، لأن الحديد غير قابل لإعادة الانتقال داخل النبات فتظهر الأعراض على النموات الحديثة أولًا.","category":"nutrient"},{"name":"نقص النيتروجين (N)","slug":"n_deficiency","symptom":"اصفرار عام منتظم (غير محصور بين العروق) يبدأ من الأوراق المسنة السفلية ويتقدم تدريجيًا للأعلى، مع ضعف عام في قوة النمو الخضري وصغر حجم الأوراق الجديدة.","explain":"النيتروجين عنصر متحرك داخل النبات، فعند نقصه ينتقل من الأوراق المسنة إلى الحديثة، ما يفسر ظهور الاصفرار العام من الأسفل أولًا.","category":"nutrient"},{"name":"نقص البوتاسيوم (K)","slug":"k_deficiency","symptom":"احتراق واسمرار في حواف الأوراق المسنة يبدأ من الحافة الخارجية ويتقدم للداخل (Scorch)، مع ضعف واضح في مقاومة النبات للجفاف والأمراض وترهل الثمار.","explain":"البوتاسيوم ينظم توازن الماء وإغلاق الثغور، ونقصه يظهر كحرق حافي على الأوراق الأقدم لأنه عنصر متحرك يُسحب منها أولًا.","category":"nutrient"},{"name":"نقص المغنيسيوم (Mg)","slug":"mg_deficiency","symptom":"اصفرار بين العروق يبدأ من الأوراق المسنة القاعدية (عكس الحديد تمامًا) وقد يصاحبه احمرار أو بنفسجية عند بعض الأصناف، ويتقدم من أسفل النبات نحو الأعلى.","explain":"المغنيسيوم هو مركز جزيء الكلوروفيل وهو عنصر متحرك، فعند نقصه يُسحب من الأوراق المسنة لصالح الحديثة، فتظهر الأعراض أولًا في الأسفل بعكس الحديد.","category":"nutrient"},{"name":"نقص الزنك (Zn)","slug":"zn_deficiency","symptom":"تصغّر ملحوظ في حجم الأوراق الطرفية مع تقارب السلاميات (تعقّد النموات في شكل وردي Rosetting)، مصحوبًا باصفرار بين العروق في الأوراق الحديثة.","explain":"الزنك ضروري لتصنيع هرمونات النمو (الأوكسينات)، ونقصه يوقف استطالة السلاميات فتظهر النموات متقاربة وصغيرة الأوراق (تعقّد).","category":"nutrient"},{"name":"نقص الكالسيوم (Ca)","slug":"ca_deficiency","symptom":"تيبّس وتقزّم في قمم النموات الحديثة مع ضعف واضح في الجذور، وقد يظهر تعفن أو تشقق في طرف الثمار الزهري في الأنواع المثمرة.","explain":"الكالسيوم غير متحرك في النبات ولازم لبناء جدران الخلايا، فنقصه يضرب أولًا الأنسجة الحديثة سريعة الانقسام (القمم النامية وأطراف الثمار).","category":"nutrient"},{"name":"نقص البورون (B)","slug":"b_deficiency","symptom":"تشقق في السيقان والأعناق مع سقوط ملحوظ للأزهار وضعف في نسبة العقد (تلقيح ضعيف)، وتشوه أو تصلب في الثمار الناتجة.","explain":"البورون ضروري لنمو أنبوب اللقاح وانقسام الخلايا في الأنسجة الحديثة، فنقصه يضعف التلقيح والعقد ويسبب تشققًا في الأنسجة سريعة النمو.","category":"nutrient"},{"name":"البياض الدقيقي","slug":"powdery_mildew","crops":["grape","apple","cucumber","strawberry"],"symptom":"طبقة دقيقية بيضاء إلى رمادية تغطي السطحين العلوي والسفلي للأوراق والبراعم، مع تجعد وتقزّم النموات الفتية وتساقطها أحيانًا. ينشط في جو دافئ جاف نهارًا مع رطوبة عالية ليلاً.","explain":"المظهر \"الدقيقي\" الأبيض الجاف المنتشر على السطحين مع نشاط الجو الدافئ الجاف نهارًا هو العلامة المميزة للبياض الدقيقي، بخلاف البياض الزغبي المرتبط بالرطوبة الممطرة.","treatment":"الكبريت الزراعي رشًا وقائيًا دوريًا، أو مبيد فطري جهازي من مجموعة التريازول عند الإصابة الفعلية، مع تحسين التهوية بين النباتات.","category":"fungal"},{"name":"البياض الزغبي","slug":"downy_mildew","crops":["grape","cucumber"],"symptom":"بقع صفراء زيتية على السطح العلوي للورقة، ويقابلها بالضبط نمو زغبي رمادي إلى بنفسجي على السطح السفلي فقط. ينشط بشدة في الطقس الرطب الممطر.","explain":"وجود النمو الزغبي محصورًا في السطح السفلي فقط مقابل بقعة صفراء علوية، مع ارتباطه بالرطوبة والمطر، يميزه بوضوح عن البياض الدقيقي.","treatment":"مركبات نحاسية (أوكسي كلورو النحاس) وقائيًا، أو مبيد جهازي من مجموعة الميتالاكسيل عند الإصابة، مع تجنب الري العلوي مساءً.","category":"fungal"},{"name":"العفن الرمادي (بوتريتس)","slug":"botrytis","crops":["grape","strawberry","tomato"],"symptom":"تعفن طري بني رمادي مع نمو عفن قطني كثيف رمادي اللون يغطي الثمار الناضجة أو الأزهار، يظهر بقوة بعد فترات مطر أو رطوبة عالية مستمرة.","explain":"التعفن الطري المصحوب بنمو قطني رمادي كثيف على الأنسجة الرطبة (الثمار والأزهار تحديدًا) توقيع مميز لفطر البوتريتس.","treatment":"مبيد فطري متخصص ضد البوتريتس (مجموعة الأنيلينوبيريميدين)، مع تقليل كثافة الأوراق حول العناقيد والثمار لتحسين التهوية.","category":"fungal"},{"name":"صدأ الأوراق","slug":"leaf_rust","crops":["wheat","beans"],"symptom":"بثرات صغيرة بارزة برتقالية إلى بنية تتوزع على السطح السفلي غالبًا، وتترك مسحوقًا ملونًا عند فرك الورقة باليد.","explain":"شكل البثرات البارزة مع \"المسحوق\" الملون الذي يعلق باليد عند اللمس هو العلامة التشخيصية القياسية لأمراض الصدأ.","treatment":"مبيد فطري جهازي من مجموعة التريازول عند ظهور أولى البثرات، مع زراعة أصناف مقاومة عند توفرها كإجراء وقائي أساسي.","category":"fungal"},{"name":"التفحم","slug":"smut","crops":["wheat","corn"],"symptom":"تحوّل حبيبات السنبلة أو كوز الذرة إلى كتلة سوداء مسحوقية بالكامل بدلًا من الحبوب الطبيعية، مع بقاء الغلاف الخارجي سليمًا في البداية.","explain":"استبدال الحبة بالكامل بكتلة سوداء مسحوقية (بدل بقعة على الورقة) هو ما يميز أمراض التفحم عن باقي الأمراض الفطرية.","treatment":"لا علاج بعد ظهور الأعراض على السنابل؛ الوقاية الوحيدة الفعالة معاملة البذور قبل الزراعة بمطهر فطري جهازي مخصص للبذار.","category":"fungal"},{"name":"اللفحة المتأخرة","slug":"late_blight","crops":["potato","tomato"],"symptom":"بقع بنية مائية غير منتظمة الحواف تتوسع بسرعة كبيرة خلال أيام، مع نمو أبيض خفيف على حافة البقعة السفلية في الجو الرطب، وتعفن فيما بعد بالدرنات أو الثمار.","explain":"السرعة الفائقة في انتشار البقع مع النمو الأبيض على الحافة السفلية في الرطوبة هما ما يميزان اللفحة المتأخرة عن المبكرة الأبطأ والأكثر انتظامًا.","treatment":"مبيد نحاسي وقائي أو مركب جهازي من مجموعة الماكوزيب فور ظهور الجو الرطب المناسب، مع إزالة النباتات المصابة فورًا لمنع الانتشار.","category":"fungal"},{"name":"اللفحة المبكرة","slug":"early_blight","crops":["potato","tomato","eggplant"],"symptom":"بقع بنية دائرية منتظمة تحمل حلقات متحدة المركز (بشكل يشبه الهدف)، تبدأ من الأوراق المسنة السفلية أولًا وتتقدم ببطء نسبي.","explain":"الحلقات المتحدة المركز الواضحة (شكل الهدف) بالإضافة لبدء الإصابة من الأوراق المسنة هما العلامة المميزة للفحة المبكرة.","treatment":"مبيد من مجموعة الماكوزيب أو الكلوروثالونيل رشًا وقائيًا دوريًا خلال موسم الرطوبة.","category":"fungal"},{"name":"عين الطاووس","slug":"peacock_spot","crops":["olive"],"symptom":"بقع دائرية بنية إلى سوداء محاطة بهالة صفراء واضحة على السطح العلوي للورقة، تتسبب في تساقط أوراق شديد خلال الشتاء الرطب.","explain":"الهالة الصفراء المحيطة بالبقعة الداكنة (تشبه شكل ريشة الطاووس) هي العلامة المميزة لهذا المرض الخاص بالزيتون.","treatment":"رشة نحاسية وقائية (مزيج بوردو) في الخريف قبل بدء موسم الأمطار.","category":"fungal"},{"name":"عفن الذبول (فيرتيسيليوم)","slug":"verticillium_wilt","crops":["eggplant","pepper","strawberry"],"symptom":"ذبول تدريجي أحادي الجانب في النبات مصحوب باصفرار الأوراق السفلية، وعند قطع الساق طوليًا يظهر تلوّن بني داخلي واضح في الأنسجة الوعائية.","explain":"التلوّن البني الداخلي في الأوعية عند القطع، مع الذبول الأحادي الجانب، دليل قاطع على انسداد الأوعية بفطريات الذبول وليس نقص ري عادي.","treatment":"لا يوجد علاج كيميائي فعّال بعد ظهور الإصابة؛ الوقاية عبر الدورة الزراعية وتعقيم التربة بالتشميس الشمسي قبل الزراعة.","category":"fungal"},{"name":"الأنثراكنوز","slug":"anthracnose","crops":["beans","pepper","almond"],"symptom":"بقع غائرة داكنة اللون على القرون أو الثمار وأحيانًا السيقان، بمركز فاتح اللون تتوسطه نقاط سوداء دقيقة جدًا (أجسام إثمارية للفطر).","explain":"البقع الغائرة (وليست بارزة) مع النقاط السوداء الدقيقة في مركزها الفاتح هي العلامة المميزة لمرض الأنثراكنوز.","treatment":"مبيد من مجموعة الماكوزيب أو مركب نحاسي، مع إزالة وإتلاف القرون والثمار المصابة فورًا.","category":"fungal"},{"name":"تجعد أوراق الخوخ","slug":"peach_leaf_curl","crops":["peach","apricot"],"symptom":"تجعد وتشوه وسماكة ملحوظة في الأوراق الفتية خلال الربيع، مع تحول لونها إلى أحمر أو أرجواني بدلًا من الأخضر الطبيعي.","explain":"التشوه والسماكة غير الطبيعية مع التلون الأحمر الأرجواني في الربيع تحديدًا هي بصمة مرض تجعد الأوراق عند اللوزيات ذات النواة.","treatment":"رشة نحاسية وقائية في نهاية السكون الشتوي قبل انتفاخ البراعم مباشرة؛ الرش بعد ظهور الأعراض غير مجدٍ.","category":"fungal"},{"name":"تبقع قشرة الرمان","slug":"pomegranate_spot","crops":["pomegranate"],"symptom":"بقع بنية غائرة على قشرة الثمرة تتوسع تدريجيًا وتتشقق مع اقتراب النضج، مصحوبة أحيانًا بتعفن داخلي للحبوب.","explain":"البقع الغائرة المتوسعة على القشرة تحديدًا مع اقتراب النضج، مع تشقق القشرة، تميز هذا المرض عن أضرار الحشرات السطحية.","treatment":"مبيد نحاسي وقائي مع تحسين تهوية الأشجار عبر التقليم لتقليل الرطوبة الداخلية.","category":"fungal"},{"name":"جرب التفاح","slug":"apple_scab","crops":["apple"],"symptom":"بقع خشنة الملمس بلون زيتوني إلى بني على الأوراق والثمار، مع تشقق واضح في قشرة الثمرة المصابة وتشوه في شكلها.","explain":"الملمس الخشن المميز للبقع مع التشقق السطحي في القشرة هو التوقيع الكلاسيكي لجرب التفاح.","treatment":"مبيد من مجموعة الكابتان أو التريازول رشًا وقائيًا من بداية تفتح البراعم وحتى ما بعد العقد.","category":"fungal"},{"name":"صدأ/عفن أوراق التين","slug":"fig_rust","crops":["fig"],"symptom":"بقع صفراء إلى بنية صغيرة متعددة منتشرة على السطح السفلي للأوراق، تتحول تدريجيًا إلى بنية داكنة مع تساقط مبكر وشديد للأوراق.","explain":"كثرة البقع الصغيرة المحصورة بالسطح السفلي مع التساقط المبكر الشديد يميز هذا المرض عن أضرار العناكب أو نقص العناصر.","treatment":"مركب نحاسي وقائي مع جمع وإتلاف الأوراق المتساقطة لمنع تراكم مصدر العدوى.","category":"fungal"},{"name":"موت الطرفيات (تقرح اللوز)","slug":"almond_canker","crops":["almond"],"symptom":"تقرحات على الأغصان الفتية مع خروج مادة صمغية من الشقوق، وذبول مفاجئ للأزهار والبراعم الطرفية دون سبب ظاهر آخر.","explain":"التقرح الفعلي في الغصن مصحوبًا بموت مفاجئ للطرف يميز هذه الإصابة الفطرية عن التصمغ الفسيولوجي البسيط الخالي من التقرح.","treatment":"تقليم وإحراق الأجزاء المصابة فورًا، مع رشة نحاسية وقائية بعد كل عملية تقليم.","category":"fungal"},{"name":"المن","slug":"aphids","crops":["citrus","cucumber","pepper","wheat","beans"],"symptom":"تجمعات كثيفة من حشرات صغيرة خضراء أو سوداء على السطح السفلي للأوراق والبراعم الطرفية، مع تجعد وتشوه الأوراق وإفراز مادة لزجة (ندوة عسلية) قد ينمو عليها عفن أسود لاحقًا.","explain":"التجمعات الحشرية الظاهرة بالعين مع الندوة العسلية اللزجة والعفن الأسود المرافق هي العلامة الأكثر وضوحًا للتفريق بين المن وأي اصفرار مرضي أو غذائي.","treatment":"مبيد جهازي من مجموعة النيونيكوتينويد أو صابون مبيد حشري عند الإصابات المحدودة، مع إطلاق أو تشجيع أسد المن كمكافحة حيوية.","category":"pest"},{"name":"الذبابة البيضاء","slug":"whitefly","crops":["tomato","eggplant","cucumber"],"symptom":"سرب من حشرات بيضاء صغيرة تتطاير فور تحريك النبات، مع اصفرار الأوراق ونمو عفن أسود على الندوة العسلية المرافقة، وأحيانًا أعراض فيروسية كتجعد الأوراق.","explain":"التطاير الجماعي الفوري عند لمس النبات هو أوضح علامة ميدانية تميز الذبابة البيضاء عن باقي الحشرات الماصة.","treatment":"مصائد صفراء لاصقة للرصد والحد من الأعداد، مع مبيد متخصص من مجموعة السبيروتيترامات عند الإصابة الشديدة والمكافحة الحيوية بطفيليات متخصصة.","category":"pest"},{"name":"حفار أوراق وثمار البندورة","slug":"tuta_absoluta","crops":["tomato"],"symptom":"أنفاق بيضاء متعرجة داخل نسيج الورقة، مع ثقوب دخول صغيرة في الثمار يظهر حولها براز الحشرة الأسود من الداخل.","explain":"الأنفاق المتعرجة داخل نسيج الورقة نفسها (وليس على سطحها) هي العلامة المميزة لهذه الحشرة القارضة الدقيقة.","treatment":"مصائد فرمونية للرصد المبكر، مع مبيد حيوي من بكتيريا الباسيلس ثورنجينسيس (Bt) أو مبيد Spinosad عند بداية الإصابة.","category":"pest"},{"name":"دودة درنات البطاطا","slug":"potato_tuber_moth","crops":["potato"],"symptom":"ثقوب وأنفاق داخلية في الدرنات نفسها مع وجود يرقات صغيرة بداخلها، مصحوبة بذبول جزئي خفيف للنبات فوق سطح التربة.","explain":"الإصابة الداخلية في الدرنة تحديدًا (وليس فقط على الأوراق) هي ما يميز هذه الآفة عن باقي حشرات البطاطا السطحية.","treatment":"تعميق التربة فوق الدرنات لمنع وصول الفراشة إليها، مع مبيد حيوي (Bt) وقت ذروة نشاط الفراشات ووضع البيض.","category":"pest"},{"name":"حفار ساق الذرة","slug":"corn_borer","crops":["corn"],"symptom":"ثقوب دائرية واضحة في السيقان والأوراق مع وجود نشارة بنية (فضلات الحشرة) عند الثقوب، وقد ينكسر النبات عند موقع الإصابة.","explain":"وجود النشارة البنية عند الثقوب في الساق نفسه دليل واضح على حفر داخلي وليس مجرد قرض سطحي للأوراق.","treatment":"مبيد حبيبي من الباسيلس ثورنجينسيس (Bt) يوضع في قمة النبات وقت ظهور اليرقات الصغيرة قبل دخولها الساق.","category":"pest"},{"name":"سونة الحبوب","slug":"sunn_pest","crops":["wheat"],"symptom":"بقع بيضاء منتفخة حول موقع لسع الحبة الواحدة، مع تدهور واضح في جودة الطحين ومرونة العجين الناتج عن هذه الحبوب لاحقًا.","explain":"أثر اللسعة الموضعي على الحبة الواحدة مع تأثيره الكيميائي على جودة الطحين هو ما يميز هذه الآفة عن أمراض السنابل الفطرية.","treatment":"المكافحة تُوجَّه لمرحلة الحوريات الصغيرة قبل اكتمال نموها، وفق توصية جهة الإرشاد الزراعي المحلية بخصوص المبيد ومناسبة التوقيت.","category":"pest"},{"name":"فراشة ثمار التفاح","slug":"codling_moth","crops":["apple"],"symptom":"ثقب دخول صغير في قشرة الثمرة محاط بنشارة بنية، مع نفق داخلي يصل حتى بذور الثمرة وتساقط مبكر للثمار المصابة.","explain":"النفق الداخلي الذي يصل تحديدًا إلى منطقة البذور هو العلامة المميزة لهذه الآفة عن باقي حشرات ثقب الثمار.","treatment":"مصائد فرمونية للرصد وتحديد توقيت الفقس، مع مبيد Spinosad أو مماثل يُطبَّق عند بداية فقس البيض قبل دخول اليرقة للثمرة.","category":"pest"},{"name":"ذبابة ثمار الفاكهة","slug":"fruit_fly","crops":["peach","apricot","fig","pomegranate"],"symptom":"نقاط لسع داكنة صغيرة على قشرة الثمرة، يتبعها تعفن داخلي طري حول موقع اللسع مع وجود يرقات بيضاء صغيرة بالداخل عند الفحص.","explain":"التعفن الداخلي الطري الذي يبدأ من نقطة لسع سطحية صغيرة جدًا هو ما يميز إصابة ذبابة الفاكهة عن الأمراض الفطرية المباشرة.","treatment":"مصائد غذائية جاذبة (طُعم بروتيني) للرصد والحد من الأعداد، مع رش جزئي بطُعم سام بدل رش الشجرة كاملة.","category":"pest"},{"name":"دودة أوراق العنب","slug":"grape_leafroller","crops":["grape"],"symptom":"التفاف وأكل حواف الأوراق مع وجود لفائف حريرية تجمع عدة أوراق مع بعضها، وأحيانًا ثقوب داخل حبات العنقود قبل النضج.","explain":"اللفائف الحريرية التي تربط الأوراق ببعضها هي العلامة الميدانية الأوضح لهذه الآفة على الكرمة.","treatment":"مبيد حيوي (Bt) عند ظهور اليرقات الصغيرة، مع إزالة اللفائف الورقية يدويًا لتقليل الأعداد دون الحاجة لرش كامل.","category":"pest"},{"name":"العنكبوت الأحمر","slug":"spider_mites","crops":["cucumber","eggplant","almond","strawberry"],"symptom":"نقاط صفراء دقيقة متناثرة على السطح العلوي للأوراق (بقع تغذية)، مع خيوط عنكبوتية دقيقة جدًا على السطح السفلي عند اشتداد الإصابة وجفاف الأوراق تدريجيًا.","explain":"وجود الخيوط العنكبوتية الدقيقة على السطح السفلي هو الدليل الحاسم الذي يميز إصابة العنكبوت الأحمر عن أي اصفرار غذائي مشابه بالمظهر الأولي.","treatment":"مبيد أكاروسي متخصص (ليس مبيدًا حشريًا عاديًا، لأن المبيدات الحشرية العامة قد تقتل أعداءه الحيوية وتزيد انتشاره).","category":"pest"},{"name":"البق الدقيقي","slug":"mealybug","crops":["citrus","grape","fig"],"symptom":"كتل قطنية بيضاء واضحة عند إبط الأوراق وعلى العناقيد، مع إفراز ندوة عسلية ونمو عفن أسود مرافق لها.","explain":"المظهر القطني الأبيض المتكتل تحديدًا عند الإبط والعناقيد هو العلامة المميزة للبق الدقيقي عن باقي الحشرات القشرية.","treatment":"زيت معدني بستاني يخنق الحشرة في الإصابات الخفيفة، ومبيد جهازي من مجموعة النيونيكوتينويد للإصابات الشديدة.","category":"pest"},{"name":"دودة القطن/الأشطاء الليلية","slug":"cutworm","crops":["beans","corn"],"symptom":"قطع كامل للنبات الفتي عند مستوى سطح التربة أثناء الليل، مع اختفاء الشتلات صباحًا دون أي أثر واضح للحفر أو المرض حولها.","explain":"القطع الكامل المفاجئ عند سطح التربة ليلًا تحديدًا هو التوقيع المميز لهذه اليرقات الليلية القارضة.","treatment":"طُعم سام (نخالة مضافة إليها مبيد حيوي Bt) يوضع مساءً حول قواعد الشتلات مباشرة قبل نشاط اليرقات الليلي.","category":"pest"},{"name":"حفار ساق الزيتون","slug":"olive_borer","crops":["olive"],"symptom":"أنفاق داخل الأغصان والجذع مع نشارة خشبية واضحة عند فتحات الدخول، وذبول تدريجي لأطراف الأغصان المصابة.","explain":"وجود النشارة الخشبية عند فتحات دخول واضحة في الجذع نفسه يميز هذه الآفة عن أضرار الجفاف أو الأمراض الورقية.","treatment":"إزالة وحرق الأغصان المصابة فورًا، مع مصائد فرمونية للرصد المبكر قبل انتشار الإصابة لبقية الأشجار.","category":"pest"},{"name":"صانعة أنفاق أوراق الحمضيات","slug":"citrus_leafminer","crops":["citrus"],"symptom":"أنفاق فضية رفيعة ومتعرجة داخل نسيج الورقة الفتية فقط، مع تجعد وتقوس واضح للورقة حول مسار النفق.","explain":"الأنفاق الفضية الرفيعة المحصورة بالأوراق الفتية فقط هي العلامة المميزة لهذه الحشرة الصغيرة جدًا.","treatment":"زيت معدني بستاني رشًا على النموات الحديثة، مع تجنب الإفراط بالتسميد النيتروجيني الذي يحفز نموًا غضًا جاذبًا للحشرة.","category":"pest"},{"name":"فيلوكسرا العنب","slug":"phylloxera","crops":["grape"],"symptom":"تورمات عقدية صغيرة (galls) تظهر على الجذور أو على السطح السفلي لبعض الأوراق، مع ضعف عام وتدريجي في نمو الكرمة دون سبب مرضي ظاهر بالأعلى.","explain":"التورمات العقدية الغريبة (galls) على الجذور تحديدًا هي العلامة الفارقة لهذه الآفة الخطيرة على الكرمة.","treatment":"لا يوجد علاج كيميائي فعّال على الجذور المصابة؛ الحل الأساسي عالميًا هو التطعيم على أصول كرمة مقاومة (Rootstocks).","category":"pest"},{"name":"تعفن طرف الثمرة","crops":["tomato","pepper","eggplant"],"shape":"fruit","symptom":"بقعة داكنة غائرة وجافة تظهر تحديدًا في الطرف الزهري للثمرة (الطرف المقابل للعنق)، دون وجود أي نمو فطري ظاهر عليها في بدايتها.","explain":"اقتصار العرض على الطرف الزهري بالذات، مع جفاف البقعة (لا تعفن رطب فطري)، يدل على اضطراب فسيولوجي مرتبط بنقص كالسيوم موضعي وعدم انتظام الري، وليس مرضًا أو حشرة.","category":"physio"},{"name":"تشقق الثمار","crops":["tomato","pomegranate","grape"],"shape":"fruit","symptom":"تشققات طولية أو دائرية تظهر فجأة في قشرة الثمرة، عادة خلال يوم أو يومين بعد ري غزير أو مطر أعقب فترة جفاف طويلة نسبيًا.","explain":"الارتباط الزمني المباشر بري غزير مفاجئ بعد عطش، دون أي أعراض ذبول أو تبقع مرضي مسبق، يؤكد أن السبب فسيولوجي بحت وليس مرضيًا.","category":"physio"},{"name":"لفحة الشمس","crops":["pepper","tomato","apple","pomegranate"],"shape":"fruit","symptom":"بقعة بيضاء إلى بنية فاتحة، جلدية المظهر ومسطحة، تظهر فقط على الجانب المعرض مباشرة لأشعة الشمس من الثمرة، وغالبًا بعد تقليم أزال الأوراق الواقية فجأة.","explain":"اقتصار البقعة على الجهة المشمسة فقط، وارتباطها بفقدان مفاجئ للتظليل الورقي، ينفي أي سبب مرضي أو حشري ويؤكد أنها حرق شمسي مباشر.","category":"physio"},{"name":"تصمغ اللوزيات","crops":["almond","apricot","peach"],"shape":"branch","symptom":"خروج مادة صمغية كهرمانية اللون من الجذع أو الأغصان دون وجود أي ثقوب حشرية أو تقرحات فطرية واضحة حول موقع خروج الصمغ.","explain":"غياب أي ثقب حشري أو تقرح فطري حول الصمغ يوجه التشخيص نحو استجابة فسيولوجية دفاعية للنبات تجاه إجهاد أو جرح، لا إلى آفة أو مرض مباشر.","category":"physio"},{"name":"تساقط الأزهار والعقد","crops":["citrus","olive","pomegranate"],"shape":"leaf","symptom":"تساقط غير طبيعي وكثيف للأزهار أو الثمار الصغيرة حديثة العقد، دون ظهور أي أعراض مرضية أو حشرية على الأوراق المرافقة لها.","explain":"خلو الأوراق من أي أعراض مرضية أو حشرية، مع تزامن التساقط مع فترة تزهير حرجة، يشير إلى إجهاد حراري أو مائي مؤقت وليس إصابة فعلية.","category":"physio"},{"name":"حرق الصقيع الربيعي","crops":["grape","apple","almond"],"shape":"leaf","symptom":"احتراق وذبول مفاجئ للبراعم والأوراق الفتية فقط بعد ليلة باردة صافية في بداية الربيع، مع سلامة تامة لبقية النبات وأعضائه الأخرى.","explain":"الارتباط الزمني المباشر بموجة برد ليلية، واقتصار الضرر على الأنسجة الفتية الطرية فقط، يؤكدان أن السبب صقيع متأخر وليس مرضًا.","category":"physio"},{"name":"بقاء الكتف الأخضر","crops":["tomato"],"shape":"fruit","symptom":"بقاء منطقة خضراء أو صفراء واضحة في الجزء العلوي من الثمرة عند اكتمال النضج، بينما بقية الثمرة تكتسب لونها الأحمر الطبيعي بشكل كامل.","explain":"اقتصار الخلل على منطقة محددة من الثمرة (الكتف) مرتبط عادة بارتفاع الحرارة أثناء النضج أو نقص بوتاسيوم، دون أي علاقة بمرض أو حشرة.","category":"physio"},{"name":"ظاهرة تبادل الحمل","crops":["olive","apple","pomegranate"],"shape":"leaf","symptom":"إنتاج غزير جدًا من الثمار في موسم واحد، يليه مباشرة موسم بإنتاج ضعيف جدًا من نفس الأشجار، دون أي تغيّر ملحوظ في مظهر الأوراق بين الموسمين.","explain":"ثبات مظهر الأوراق وسلامتها بين الموسمين مع تذبذب الإنتاج فقط ينفي أي سبب مرضي، ويؤكد أنها ظاهرة فسيولوجية دورية معروفة في أشجار الفاكهة.","category":"physio"},{"name":"تشقق اللحاء الشتوي","crops":["apple","peach"],"shape":"branch","symptom":"تشقق طولي واضح في لحاء الجذع، تحديدًا على الجهة الجنوبية الغربية المعرضة للشمس، يظهر بعد انتهاء فصل الشتاء دون أي علامات حشرية داخل الشق.","explain":"تحديد موقع الشق بالجهة الأكثر تعرضًا لتقلبات الحرارة الشمسية، وخلوه من أي نشاط حشري داخلي، يؤكد أن السبب تمدد وانكماش حراري فسيولوجي.","category":"physio"},{"name":"الذبول الظهري المؤقت","crops":["cucumber","pepper","eggplant"],"shape":"leaf","symptom":"ذبول ظاهري في الأوراق يظهر في وسط النهار شديد الحرارة، ثم يعود النبات لانتصابه الطبيعي الكامل مساءً دون أي تغيّر في لون الأوراق.","explain":"زوال الذبول تلقائيًا مساءً دون أي أثر لوني دائم ينفي وجود مشكلة جذرية أو مرضية حقيقية، ويؤكد أنه إجهاد نتحي مؤقت متعلق بالحرارة فقط.","category":"physio"},{"name":"ضعف التلقيح وتشوه الثمار","crops":["tomato","strawberry"],"shape":"fruit","symptom":"تشوه واضح في شكل الثمرة وعدم انتظامها، مع تشقق أو تجعد بسيط قرب النهاية الزهرية للثمرة، دون أي أعراض مرضية أو حشرية على النبات ككل.","explain":"اقتصار المشكلة على شكل الثمرة فقط دون أي أعراض أخرى على النبات يوجه التشخيص نحو ضعف تلقيح ناتج عن حرارة عالية أو نقص ملقحات أثناء الإزهار.","category":"physio"},{"name":"الاصفرار الطبيعي للأوراق المسنة","crops":["grape","wheat"],"shape":"leaf","symptom":"اصفرار وتساقط تدريجي منتظم يقتصر على الأوراق السفلية المسنة فقط قرب نهاية الموسم، دون أي انتشار للاصفرار نحو الأوراق الحديثة العلوية.","explain":"اقتصار الاصفرار على الأوراق المسنة فقط قرب نهاية دورة النبات، دون امتداده للأعلى، يدل على شيخوخة طبيعية للأوراق وليس نقص عنصر أو مرضًا نشطًا.","category":"physio"},{"name":"نزيف العصارة بعد التقليم المتأخر","crops":["grape"],"symptom":"تسرّب كثيف لسائل شفاف يشبه الماء من مكان القطع، يستمر لعدة أيام بعد إجراء التقليم متأخرًا قرب بداية تحرك العصارة الربيعية.","explain":"التقليم المتأخر بعد بدء نشاط الجذور ربيعيًا يجعل الضغط الداخلي يدفع العصارة للخروج من الجروح الطازجة مباشرة؛ الحل تبكير موعد التقليم الشتوي لا علاجه بعد حدوثه.","category":"pruning"},{"name":"تعفن جروح التقليم غير المعالجة","crops":["apple","olive","almond"],"symptom":"تعفن بني إلى أسود يتمدد تدريجيًا حول مكان قطع تقليم قديم، لم يُعقّم عند القطع ولم يُغطَّ بمعجون واقٍ بعد ذلك.","explain":"ترك جرح التقليم مكشوفًا دون تعقيم أو تغطية يفتح بابًا مباشرًا لدخول الفطريات المتعفنة عبر النسيج الخشبي المكشوف.","category":"pruning"},{"name":"التقليم الجائر وفقدان الإثمار","crops":["olive","grape","pomegranate"],"symptom":"إنتاج نموات خضرية قوية ومفرطة (سرطانات) في الموسم التالي مباشرة لتقليم شديد جدًا، على حساب تكوّن الأزهار والثمار.","explain":"التقليم الجائر يدفع النبات لإعادة بناء الجهاز الخضري أولًا كأولوية بيولوجية، فيؤجل أو يقلل التزهير والإثمار في الموسم التالي مباشرة.","category":"pruning"},{"name":"تقليم شتوي في توقيت خاطئ","crops":["peach","apricot"],"symptom":"موت أطراف الأفرع التي جرى تقليمها مباشرة قبل موجة صقيع شتوية قارسة، بينما الأفرع غير المقلمة من نفس الشجرة تبقى سليمة.","explain":"القطع الطازج يزيل الطبقة الواقية الطبيعية للأنسجة الطرفية، فيصبح الجرح والنسيج المجاور أكثر عرضة للتلف عند تعرضه لصقيع مباشر بعده بوقت قصير.","category":"pruning"},{"name":"إهمال تخفيف الثمار","crops":["apple","peach","citrus"],"symptom":"ثمار صغيرة الحجم وغير منتظمة النضج، مع تكسّر بعض الأفرع تحت وزن الحمل الزائد، رغم عدم وجود أي أعراض مرضية أو حشرية.","explain":"ترك عدد ثمار أكبر مما تستطيع الشجرة تغذيته يوزع الموارد على عدد أكبر فتصغر الثمار الفردية، وقد يتجاوز الحمل قدرة الأفرع الميكانيكية.","category":"pruning"},{"name":"عدم إزالة السرطانات القاعدية","crops":["citrus","olive","almond"],"symptom":"نمو كثيف لأفرع من قاعدة الجذع أو من أسفل نقطة التطعيم مباشرة، يستهلك جهدًا غذائيًا ملحوظًا مع ضعف واضح في إنتاج الجزء العلوي المطعّم.","explain":"السرطانات القاعدية تنافس الطبقة العلوية المرغوبة (المطعّمة) على الماء والغذاء دون أن تعطي إنتاجًا نوعيًا، فتُستنزف الشجرة لصالح نمو غير مفيد.","category":"pruning"},{"name":"تشابك الأغصان الداخلية","crops":["apple","pomegranate","fig"],"symptom":"ضعف واضح في تلوّن ونضج الثمار الداخلية للتاج، مع رطوبة عالية محتبسة داخل الشجرة تشجع ظهور أمراض فطرية، نتيجة عدم تخفيف الأغصان الداخلية المتشابكة.","explain":"الكثافة الداخلية الزائدة تمنع دخول الضوء والتهوية، فتضعف تلوّن الثمار الداخلية وترفع الرطوبة الموضعية المهيّئة لنمو الفطريات.","category":"pruning"},{"name":"خطأ تقليم القصبات مقابل الدوابر","crops":["grape"],"symptom":"نمو خضري غزير وكثيف مع نقص واضح وغير متناسب في عدد العناقيد المتكونة، رغم أن خصوبة التربة والتسميد في مستوى جيد جدًا.","explain":"اختيار نظام تقليم غير مناسب لصنف الكرمة (قصبات طويلة مقابل دوابر قصيرة) يغيّر توزيع البراعم المثمرة فينتج خضريًا أكثر مما يُنتج ثمريًا.","category":"pruning"},{"name":"تقليم جذري خاطئ عند الشتل","crops":["tomato","pepper"],"symptom":"ذبول وضعف واضح في نمو الشتلة بعد أيام قليلة من الشتل، دون وجود أي إصابة حشرية أو فطرية ظاهرة على الجزء الخضري أو الجذري.","explain":"تقليم جذري جائر أو غير سليم قبل الزراعة يقلل من مساحة الامتصاص الجذري، فتضعف الشتلة في التأقلم حتى لو كانت التربة والري ملائمين تمامًا.","category":"pruning"},{"name":"غياب تدريب الأفرع الهيكلية مبكرًا","crops":["apple","pomegranate"],"symptom":"شكل غير متوازن للشجرة مع تزاحم واضح للأفرع الرئيسية عند القاعدة منذ السنوات الأولى، ما يصعّب لاحقًا عمليات المكافحة والقطف.","explain":"عدم توجيه الهيكل الرئيسي في السنوات الأولى يترك أثرًا دائمًا على شكل الشجرة يصعب تصحيحه لاحقًا دون إجراء تقليم جائر تعويضي.","category":"pruning"},{"name":"ترك جروح أفقية تجمع الماء","crops":["olive","almond"],"symptom":"تعفن داخلي تدريجي في الجذع يبدأ من مكان قطع أفقي كبير قديم، تتجمع فيه مياه الأمطار بدلًا من الانزلاق عنه.","explain":"القطع الأفقي (بدل المائل) يحول الجرح إلى حوض صغير يحتجز مياه الأمطار، فتطول فترة رطوبة النسيج المكشوف وتزيد فرصة التعفن الداخلي.","category":"pruning"},{"name":"إهمال إزالة الأشطاء الجانبية","crops":["corn","tomato"],"symptom":"ضعف ملحوظ في حجم الثمار أو الكيزان الرئيسية دون أي عرض مرضي، نتيجة تنافس أشطاء جانبية كثيفة مع الساق الرئيسي على الغذاء والضوء.","explain":"الأشطاء غير المزالة تستهلك جزءًا من موارد النبات المخصصة أصلًا للإنتاج الرئيسي، فيظهر الأثر كضعف في حجم المحصول الأساسي دون أي سبب مرضي.","category":"pruning"},{"name":"اختناق الجذور بالري الزائد","crops":["tomato","citrus"],"symptom":"اصفرار عام مفاجئ للأوراق مع ذبول واضح رغم أن رطوبة التربة عالية جدًا، وعند فحص الجذور تظهر بنية اللون طرية ومتعفنة.","explain":"التناقض الظاهري بين الذبول ورطوبة التربة العالية هو المفتاح: الجذور تختنق من نقص الأكسجين في تربة مشبعة بالماء فتتعفن ولا تعود قادرة على امتصاص الماء رغم توفره.","category":"irrigation"},{"name":"ملوحة مياه الري","crops":["citrus","almond","grape"],"symptom":"احتراق بني في حواف الأوراق مصحوب بتقزّم عام في النمو، مع ظهور طبقة بيضاء ملحية رقيقة على سطح التربة بعد الري وجفافها.","explain":"الطبقة البيضاء الملحية الظاهرة على سطح التربة بعد الجفاف هي أوضح دليل ميداني على أن سبب حرق الأوراق هو تراكم الأملاح لا نقص عنصر غذائي.","category":"irrigation"},{"name":"تشقق الثمار من الري غير المنتظم","crops":["tomato","pomegranate","grape"],"symptom":"تشقق مفاجئ وواسع في الثمار خلال يوم أو يومين بعد ري غزير أو مطر أعقب فترة عطش طويلة نسبيًا للنبات.","explain":"انتظام جدول الري (كميات أصغر وأكثر تكرارًا) يمنع هذا التذبذب الحاد في امتصاص الماء الذي يسبب التمدد السريع المفاجئ للثمرة وتشققها.","category":"irrigation"},{"name":"حرق الأسمدة الكيميائية المركزة","crops":["pepper","cucumber","corn"],"symptom":"احتراق واضح في حواف الأوراق يظهر خلال أيام قليلة فقط من إضافة سماد كيميائي مركّز قريبًا جدًا من الجذور دون ري كافٍ بعدها مباشرة.","explain":"التركيز العالي للأملاح المعدنية قرب الجذور مباشرة يرفع الضغط الأسموزي حول الجذور فيسحب الماء منها بدل أن تمتصه، فيظهر الحرق كأثر جفاف موضعي.","category":"irrigation"},{"name":"سوء توقيت التسميد الآزوتي المتأخر","crops":["wheat","corn"],"symptom":"تأخر واضح في نضج المحصول مع إطالة غير مرغوبة لفترة النمو الخضري، وضعف في اكتمال امتلاء الحبوب بعد إضافة سماد نيتروجيني متأخر قرب مرحلة النضج.","explain":"إضافة النيتروجين متأخرًا تدفع النبات لمواصلة النمو الخضري بدل التحول الطبيعي لمرحلة النضج والتخزين، فيتأخر الحصاد وتضعف جودة الحبوب.","category":"irrigation"},{"name":"الري بالرش وقت الظهيرة الحارة","crops":["cucumber","beans"],"symptom":"حروق شمسية موضعية بيضاء اللون تظهر على الأوراق المبللة بعد الري بالرش مباشرة في وقت اشتداد الحرارة والشمس ظهرًا.","explain":"قطرات الماء المتبقية على الورقة تعمل كعدسات مكبرة صغيرة تحت الشمس القوية، فتحرق الأنسجة موضعيًا؛ الري صباحًا باكرًا أو مساءً يتجنب هذا الأثر.","category":"irrigation"},{"name":"نقص الري وقت العقد الحرج","crops":["olive","almond","apricot"],"symptom":"تساقط كثيف وغير طبيعي للثمار الصغيرة حديثة العقد، بعد فترة عطش قصيرة نسبيًا لكنها حدثت في توقيت حرج جدًا لمرحلة العقد.","explain":"مرحلة العقد المبكر حساسة جدًا للإجهاد المائي حتى لو كان قصيرًا، لأن النبات يتخلى عن الأعضاء الحديثة الأقل أولوية بيولوجية للحفاظ على بقية النبات.","category":"irrigation"},{"name":"انسداد جزئي في شبكة التنقيط","crops":["grape","tomato"],"symptom":"نمو غير منتظم واضح ضمن نفس الخط الزراعي، حيث تبدو بعض النباتات ذابلة وضعيفة بينما النباتات المجاورة لها مباشرة سليمة تمامًا رغم تطابق نوع التربة.","explain":"التفاوت الحاد بين نباتات متجاورة في نفس ظروف التربة يستبعد الأسباب المرضية أو الغذائية العامة، ويوجه الشك مباشرة نحو انسداد ميكانيكي موضعي في النقاطات.","category":"irrigation"},{"name":"تثبيط الزنك بالتسميد الفوسفاتي الزائد","crops":["corn","beans"],"symptom":"ظهور أعراض تشبه تمامًا نقص الزنك (تصغّر الأوراق وتقارب السلاميات) رغم أن تحليل التربة يؤكد توفر الزنك بكميات كافية أصلًا.","explain":"الإفراط في التسميد الفوسفاتي يتفاعل كيميائيًا مع الزنك في التربة ويقلل من صورته الجاهزة للامتصاص، فتظهر أعراض نقص وظيفي رغم توفره الفعلي في التربة.","category":"irrigation"},{"name":"جفاف سطحي مع رطوبة عميقة كافية","crops":["potato","beans"],"symptom":"ذبول واضح في الأوراق السطحية العلوية رغم أن فحص التربة العميقة يظهر رطوبة كافية تمامًا في منطقة الجذور الأعمق.","explain":"هذا النمط يشير غالبًا إلى ضعف انتشار المجموع الجذري السطحي أو انضغاط التربة، وليس نقص ماء فعلي في التربة، وحله معالجة بنية التربة لا زيادة الري.","category":"irrigation"},{"name":"ري غزير قبيل الحصاد مباشرة","crops":["wheat","potato"],"symptom":"تدهور ملحوظ في جودة التخزين وزيادة نسبة التعفن بعد الحصاد أو القطف، مرتبط بري غزير جرى قبيل موعد الحصاد بوقت قصير جدًا.","explain":"ارتفاع نسبة الرطوبة الداخلية في المحصول وقت الحصاد يقلل من قدرته على التخزين الجيد ويزيد من فرص التعفن اللاحق أثناء التخزين.","category":"irrigation"},{"name":"تراكم الأملاح في الري بالتنقيط طويل الأمد","crops":["tomato","pepper"],"symptom":"تراجع تدريجي وملحوظ في الإنتاجية عبر عدة مواسم متتالية، مع ظهور بقع بيضاء سطحية دقيقة تحديدًا بين خطوط النقاطات وليس تحتها مباشرة.","explain":"الأملاح تتجمع مع الزمن عند أطراف \"بصلة الترطيب\" حول كل نقاط، فتظهر بيضاء بين الخطوط تحديدًا، وهذا يستدعي غسيل التربة دوريًا وليس تغيير السماد فقط.","category":"irrigation"},{"name":"حرق السماد العضوي غير الناضج","crops":["tomato","cucumber"],"shape":"soil","symptom":"احتراق وموت واضح في الجذور الشعرية الدقيقة مع ذبول الشتلات، خلال أيام قليلة من إضافة سماد حيواني طازج غير متخمر قريبًا جدًا من الجذور مباشرة.","explain":"السماد الطازج غير المتخمر يستمر في التحلل داخل التربة منتجًا حرارة وغازات ضارة تحرق الجذور الدقيقة مباشرة؛ الحل استخدام سماد متخمر تمامًا فقط.","category":"organic"},{"name":"فائدة التغطية العضوية (المالش)","crops":["strawberry","grape"],"shape":"soil","symptom":"تحسن ملحوظ في احتفاظ التربة بالرطوبة وانخفاض واضح في نمو الأعشاب، مع تقليل تلوث الثمار الملامسة للتربة، بعد فرش طبقة من القش أو النشارة العضوية حول النبات.","explain":"طبقة التغطية العضوية تقلل التبخر السطحي وتحجب ضوء الشمس عن بذور الأعشاب، كما تفصل الثمار فيزيائيًا عن التربة الرطبة فتقل الأمراض المرتبطة بالتلامس المباشر.","category":"organic"},{"name":"التسميد الأخضر وتحسين بنية التربة","crops":["wheat","corn"],"shape":"soil","symptom":"تحسن ملحوظ في تهوية التربة وزيادة محتواها من المادة العضوية، بعد حراثة محصول بقولي (كالفول) ودمجه في التربة كسماد أخضر قبل الزراعة الرئيسية.","explain":"المحاصيل البقولية تثبّت النيتروجين الجوي في جذورها، وحراثتها وهي خضراء تضيف مادة عضوية سريعة التحلل تحسّن بنية التربة وخصوبتها معًا.","category":"organic"},{"name":"أثر تربية النحل على العقد","crops":["citrus","almond","apple"],"shape":"leaf","symptom":"زيادة ملحوظة في نسبة عقد الثمار وحجمها النهائي، بعد وضع خلايا نحل قريبة من البستان خلال فترة التزهير، مقارنة بموسم سابق لم توضع فيه خلايا.","explain":"تحسّن العقد هنا مرتبط مباشرة بتحسّن كفاءة التلقيح بفعل النحل خلال فترة التزهير الحرجة، وليس بأي تغيّر في التسميد أو الري بين الموسمين.","category":"organic"},{"name":"أثر الدورة الزراعية على الآفات التربية","crops":["potato","tomato"],"shape":"soil","symptom":"انخفاض واضح في إصابات التربة (كالنيماتودا أو الذبول) بعد زراعة محصول من عائلة مختلفة تمامًا (كالحبوب) لموسم كامل، بدل إعادة زراعة نفس عائلة الخضروات في نفس الأرض.","explain":"كسر استمرارية وجود العائل المناسب لآفة أو مرض معين في التربة لموسم كامل يقلل من كثافتها بشكل ملحوظ دون أي تدخل كيميائي.","category":"organic"},{"name":"فائدة الكمبوست الناضج جيدًا","crops":["eggplant","pepper"],"shape":"soil","symptom":"تحسن تدريجي وسليم في نمو النبات وقوامه العام، دون أي أثر حرق جذري، بعد استخدام كمبوست متخمر بالكامل مقارنة بتجربة سابقة باستخدام سماد طازج تسبب بأضرار واضحة.","explain":"اكتمال التخمر يحوّل المركبات الحرارية والغازية الضارة إلى مركبات مستقرة وآمنة للجذور، وهذا الفارق العملي هو ما يميز الكمبوست الناضج عن السماد الطازج.","category":"organic"},{"name":"المكافحة الحيوية بالمفترسات","crops":["cucumber","citrus"],"shape":"leaf","symptom":"انخفاض تدريجي وملحوظ في أعداد المن أو العنكبوت الأحمر، بعد إطلاق حشرات مفترسة طبيعية (كأسد المن) في المزرعة دون استخدام أي مبيد كيميائي.","explain":"المفترسات الطبيعية تقلل أعداد الآفة تدريجيًا عبر التغذي المباشر عليها، وهذا أسلوب مكافحة حيوي مستدام يقلل الاعتماد على المبيدات الكيميائية.","category":"organic"},{"name":"خطر مخلفات التقليم المصابة","crops":["olive","grape"],"shape":"soil","symptom":"انتشار إصابة فطرية مشابهة في مواسم لاحقة بعد ترك مخلفات تقليم كثيفة تحمل بدايات إصابة فطرية داخل الحقل أو إضافتها مباشرة للكمبوست دون معالجة حرارية كافية.","explain":"الفطريات يمكن أن تبقى حية على المخلفات النباتية المصابة وتنتقل لاحقًا؛ الحل حرق المخلفات المصابة أو التأكد من وصول الكمبوست لحرارة كافية تقتل مسببات الأمراض قبل استخدامه.","category":"organic"},{"name":"التكامل بين الحيوان والمحصول","crops":["wheat","corn"],"shape":"soil","symptom":"تحسن تدريجي وملحوظ في خصوبة التربة العامة عبر عدة مواسم متتالية، بعد دمج مخلفات حظائر الأغنام المتخمرة جيدًا ضمن دورة زراعية متكاملة مع المحاصيل الحقلية.","explain":"دمج المخلفات الحيوانية المتخمرة ضمن دورة منتظمة يعيد تدوير العناصر الغذائية عضويًا ويحسّن بنية التربة تراكميًا على مدى مواسم متعددة.","category":"organic"},{"name":"فوائد الزراعة المتداخلة","crops":["beans","corn"],"shape":"leaf","symptom":"انخفاض ملحوظ في نسبة الإصابة الحشرية وتحسّن واضح في استغلال المساحة والضوء، بعد زراعة محصولين متكاملين (بقولي وحبوب) معًا في نفس الحقل بدل الزراعة الأحادية لأي منهما.","explain":"تنوع المحاصيل يربك الحشرات المتخصصة في التعرف على عائلها المفضل، كما يستغل المحصولان طبقات مختلفة من الضوء والتربة فيقل التنافس ويزيد الإنتاج الكلي.","category":"organic"},{"name":"ضرر مخلفات معصرة الزيتون الطازجة","crops":["olive"],"shape":"soil","symptom":"ظهور احتراق جذري موضعي وتغيّر ملحوظ في حموضة التربة، بعد إضافة مخلفات معصرة الزيتون الطازجة (الجفت) مباشرة حول الأشجار دون أي معالجة أو تخمير مسبق.","explain":"الجفت الطازج يحتوي مركبات فينولية حمضية عالية التركيز تضر بالجذور مباشرة؛ لا بد من تخميره أو معالجته جيدًا قبل استخدامه كسماد عضوي آمن.","category":"organic"},{"name":"إعادة تدوير مخلفات المحصول نفسه","crops":["wheat","corn"],"shape":"soil","symptom":"تحسن تدريجي وملحوظ في محتوى التربة من المادة العضوية عبر مواسم متتالية، بعد حراثة وإعادة دمج قش المحصول السابق مباشرة في التربة بدل حرقه كالمعتاد.","explain":"حرق القش يفقد التربة كمية كبيرة من المادة العضوية والعناصر التي كان يمكن أن تعود إليها عبر التحلل الطبيعي، فإعادة دمجه يحسّن خصوبة التربة تراكميًا بدل إهدارها.","category":"organic"}]</script>
<script type="application/json" id="prevention-data">{"nutrient":"فحص تربة دوري (كل موسم) لتحديد النقص قبل ظهور الأعراض، مع تسميد متوازن بدل الاعتماد على عنصر واحد فقط.","fungal":"تهوية جيدة بين النباتات (تباعد مناسب + تقليم مخفف)، تجنب الري العلوي المسائي، وإزالة الأجزاء المصابة فور ظهورها.","pest":"مراقبة أسبوعية للأوراق (خصوصًا السطح السفلي)، مصائد لاصقة/فرمونية للرصد المبكر، وتشجيع الأعداء الحيوية الطبيعية.","physio":"انتظام جدول الري والتسميد، وحماية النبات من التغيرات المناخية المفاجئة (تظليل، تدفئة وقت الصقيع).","pruning":"تعقيم أدوات التقليم بين الأشجار، تغطية الجروح الكبيرة بمعجون واقٍ، والتقليم في التوقيت الموصى به لكل نوع.","irrigation":"جدولة الري حسب احتياج المحصول الفعلي لا حسب الروتين، وفحص شبكة التنقيط دوريًا من الانسداد أو التسريب.","organic":"التأكد من اكتمال تخمر أي سماد عضوي قبل استخدامه قرب الجذور، واتباع دورة زراعية منتظمة لكسر دورة الآفات."}</script>

auth.onAuthStateChanged(user=>{
  if(user){
    log('مسجّل دخول كـ ' + user.email);
    document.getElementById('seed-btn').disabled = false;
    document.getElementById('auth-area').style.display = 'none';
  }
});

document.getElementById('seed-btn').addEventListener('click', async ()=>{
  document.getElementById('seed-btn').disabled = true;
  log('...جارٍ قراءة البيانات المحلية');
  const cases = JSON.parse(document.getElementById('case-data').textContent);
  const facts = JSON.parse(document.getElementById('fact-data').textContent);
  const prevention = JSON.parse(document.getElementById('prevention-data').textContent);
  log('عدد الحالات: ' + cases.length + ' | عدد المراجع: ' + facts.length);

  try{
    // رفع الحالات (531) على دفعات (حد أقصى 500 لكل دفعة في Firestore)
    for(let start=0; start<cases.length; start+=400){
      const chunk = cases.slice(start, start+400);
      const batch = db.batch();
      chunk.forEach(c=>{
        const ref = db.collection('cases').doc(String(c.id));
        batch.set(ref, c);
      });
      await batch.commit();
      log('تم رفع الحالات من ' + start + ' إلى ' + (start+chunk.length));
    }

    // رفع المراجع (85)
    const factBatch = db.batch();
    facts.forEach((f,i)=>{
      const ref = db.collection('facts').doc('f' + i);
      factBatch.set(ref, f);
    });
    await factBatch.commit();
    log('تم رفع ' + facts.length + ' مرجع بحث/دليل مكافحة');

    // رفع نصائح الوقاية
    await db.collection('meta').doc('prevention').set(prevention);
    log('تم رفع نصائح الوقاية');

    log('\n✅ اكتمل الترحيل بنجاح! يمكنك الآن حذف هذا الملف وملف data.js من المستودع.');
  }catch(e){
    log('\n❌ خطأ أثناء الترحيل: ' + e.message);
    log('تأكد من قواعد الأمان (Rules) تسمح بالكتابة لحسابك حاليًا.');
  }
});
</script>
</body>
</html>
